name: API and queue tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]' rdkit numpy scikit-learn
      - run: pytest -q
      - name: Acquisition controller integrity tests
        run: python -m unittest discover -s research/acquisition -v
