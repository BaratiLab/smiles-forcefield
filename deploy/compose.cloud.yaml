# Run from repository root with --env-file deploy/cloud.env.
services:
  api:
    build:
      context: ..
    environment:
      SMILES_DATA_DIR: /app/data
      SMILES_API_KEY: ${SMILES_API_KEY:-}
      SMILES_CORS_ORIGINS: https://baratilab.github.io
    volumes:
      - jobs:/app/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
  worker:
    build:
      context: ..
    command: ["python", "-m", "smiles_service.worker"]
    environment:
      SMILES_DATA_DIR: /app/data
      SMILES_JOB_TIMEOUT: '900'
      SMILES_RETENTION_SECONDS: '86400'
      OMP_NUM_THREADS: '1'
    volumes:
      - jobs:/app/data
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped
  tls:
    image: caddy:2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set an API domain pointing to this server}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    restart: unless-stopped
volumes:
  jobs:
  caddy_data:
  caddy_config:
