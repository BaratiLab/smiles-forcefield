# Caddy is the only published ingress; nginx and API have no host ports.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=submissions:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=previews:10m rate=30r/m;
server {
  listen 80;
  client_max_body_size 8k;
  limit_req_status 429;
  location = /api/jobs {
    limit_req zone=submissions burst=2 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location = /api/preview {
    limit_req zone=previews burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}
