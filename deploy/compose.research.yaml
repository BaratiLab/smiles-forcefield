# Optional private CPU-only research controller. No public ports.
# Start alongside compose.cloud.yaml; never included in default deployment.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 2500m
    cpus: 1
    restart: 'no'
volumes:
  ollama_models:
